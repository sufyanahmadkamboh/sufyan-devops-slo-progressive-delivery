name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_IMAGE: prom/prometheus:v3.15.0
  KUBECONFORM_VERSION: v0.8.0

jobs:
  static:
    name: unit tests, lint, SLO rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install Python tooling
        run: pip install -r app/requirements-dev.txt

      - name: Unit tests (pytest)
        working-directory: app
        run: python -m pytest -q

      - name: Lint and format check (ruff)
        working-directory: app
        run: ruff check . && ruff format --check .

      - name: Shell scripts (shellcheck)
        run: shellcheck scripts/*.sh

      - name: SLO rules syntax (promtool check rules)
        run: docker run --rm -v "$PWD/slo:/slo" --entrypoint promtool "$PROMETHEUS_IMAGE" check rules /slo/rules/orders-api-slo.rules.yaml

      - name: SLO alert behaviour (promtool test rules)
        run: docker run --rm -v "$PWD/slo:/slo" -w /slo/tests --entrypoint promtool "$PROMETHEUS_IMAGE" test rules orders-api-slo.test.yaml

      - name: Helm lint
        run: helm lint charts/orders-api

      - name: Kubernetes schema validation (kubeconform, incl. Argo Rollouts CRDs)
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in charts/orders-api/values.yaml ci/fast-values.yaml; do
            helm template orders-api charts/orders-api -n delivery -f "$values" \
              | ./kubeconform -strict -summary -schema-location default -schema-location "$crds"
          done
          ./kubeconform -strict -summary platform/monitoring/*.yaml

  image:
    name: build and scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t orders-api:ci app

      - name: Vulnerability scan (Trivy, fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --no-progress orders-api:ci

  e2e:
    name: end-to-end progressive delivery on kind
    runs-on: ubuntu-latest
    needs: [static, image]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          config: kind/cluster.yaml
          cluster_name: slo-delivery

      - name: Deploy lab (Argo Rollouts, Prometheus, Grafana, orders-api 1.0.0)
        run: scripts/up.sh

      - name: Good release is promoted, bad releases are rolled back
        run: scripts/e2e.sh

      - name: Failure test - Prometheus outage during a canary
        run: scripts/chaos-prometheus-outage.sh

      - name: Security test - NetworkPolicy isolation
        run: scripts/check-network-policy.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kubectl get all,analysisrun,rollout -A -o wide > diagnostics/resources.txt || true
          kubectl -n delivery get analysisrun -o yaml > diagnostics/analysisruns.yaml || true
          kubectl -n argo-rollouts logs deploy/argo-rollouts > diagnostics/argo-rollouts.log || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: diagnostics/
