[project]
name = "orders-api"
version = "1.0.0"
description = "Orders API used to demonstrate SLO-driven progressive delivery"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S311"]  # random is used for fault injection, not cryptography

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
