{{- $selector := include "orders-api.canarySelector" . -}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: orders-api-slo
  labels: {{- include "orders-api.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    # Availability SLI of the canary pods only.
    # Threshold = (1 - {{ .Values.slo.availabilityTarget }}) x {{ .Values.analysis.maxBurnRate }} max burn rate = {{ include "orders-api.maxErrorRatio" . }}.
    # No data (no traffic reached the canary) gives an empty result and counts as a failed measurement: fail safe.
    - name: canary-error-ratio
      initialDelay: {{ .Values.analysis.initialDelay }}
      interval: {{ .Values.analysis.interval }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      consecutiveErrorLimit: {{ .Values.analysis.consecutiveErrorLimit }}
      successCondition: "len(result) > 0 && !isNaN(result[0]) && result[0] <= {{ include "orders-api.maxErrorRatio" . }}"
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            (sum(rate(http_requests_total{ {{- $selector }},code=~"5.."}[1m])) or vector(0))
            /
            sum(rate(http_requests_total{ {{- $selector }}}[1m]))
    # Latency SLI of the canary pods: p95 must stay under the latency objective.
    - name: canary-p95-latency
      initialDelay: {{ .Values.analysis.initialDelay }}
      interval: {{ .Values.analysis.interval }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      consecutiveErrorLimit: {{ .Values.analysis.consecutiveErrorLimit }}
      successCondition: "len(result) > 0 && !isNaN(result[0]) && result[0] <= {{ .Values.slo.latencyTargetSeconds }}"
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{ {{- $selector }}}[1m])))
