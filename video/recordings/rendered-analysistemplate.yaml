---
# Source: orders-api/templates/analysistemplate.yaml
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: orders-api-slo
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: orders-api-1.0.0
spec:
  args:
    - name: canary-hash
  metrics:
    # Availability SLI of the canary pods only.
    # Threshold = (1 - 0.995) x 14.4 max burn rate = 0.0720.
    # No data (no traffic reached the canary) gives an empty result and counts as a failed measurement: fail safe.
    - name: canary-error-ratio
      initialDelay: 30s
      interval: 30s
      failureLimit: 1
      consecutiveErrorLimit: 4
      successCondition: "len(result) > 0 && !isNaN(result[0]) && result[0] <= 0.0720"
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            (sum(rate(http_requests_total{app="orders-api",route="/api/orders",rollouts_pod_template_hash="{{args.canary-hash}}",code=~"5.."}[1m])) or vector(0))
            /
            sum(rate(http_requests_total{app="orders-api",route="/api/orders",rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
    # Latency SLI of the canary pods: p95 must stay under the latency objective.
    - name: canary-p95-latency
      initialDelay: 30s
      interval: 30s
      failureLimit: 1
      consecutiveErrorLimit: 4
      successCondition: "len(result) > 0 && !isNaN(result[0]) && result[0] <= 0.3"
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app="orders-api",route="/api/orders",rollouts_pod_template_hash="{{args.canary-hash}}"}[1m])))


